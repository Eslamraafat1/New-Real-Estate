name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # weekly check of the live deployment

jobs:
  build-and-test:
    name: Lint, type-check, build and E2E (local production build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Type-check
        run: npm run typecheck

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start &
          npx --yes wait-on@8 --timeout 60000 http://localhost:3000/en
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  live:
    name: E2E against the live site
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: e2e/playwright-report
          retention-days: 14
